name: loomcraft
description: "Blockascent: Block Puzzle — a no-gravity block placement puzzle wrapped in a roguelite campaign."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.3
  # Short synthesised SFX (assets/sfx/*.wav, generated by tool/make_sfx.py).
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # All tuning lives in data/*.json (spec §2.8). There is exactly one copy of
  # these files: the repo root `data/` directory, which is also what the
  # TypeScript oracle in reference/ reads. Do not duplicate them under assets/.
  assets:
    - data/curve.json
    - data/economy.json
    - data/powers.json
    - data/faults.json

    # Synthesised by tool/make_sfx.py — stdlib Python, no licence, no
    # attribution, byte-identical on a regenerate. 157 KB for ten sounds.
    - assets/sfx/

    # Two loops, generated by tool/make_music.py. Both in C major, because the
    # effects are in C pentatonic and a line clear is the most frequent sound
    # in the game — see lib/platform/music.dart.
    - assets/music/
